<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#d4a944">
<meta property="og:title" content="✨ For you">

<title>✨ For you</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;background:#d4a944}
body{position:fixed;inset:0;width:100%;font-family:'Playfair Display',Georgia,serif;color:#4a2e0e}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none;z-index:3}
h1{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 7%);margin:0;padding:0 12px;text-align:center;font-size:clamp(26px,8vw,40px);font-weight:700;color:#fff6d8;text-shadow:0 2px 14px rgba(90,50,0,.55);transition:opacity .9s,transform .9s}
h1.gone{opacity:0;transform:translateY(-14px)}
h1 span{display:inline-block;opacity:0;transform:translateY(18px) scale(.9)}
body.title h1 span{animation:rise 1s cubic-bezier(.2,.9,.3,1.2) forwards}
@keyframes rise{to{opacity:1;transform:none}}
#hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 7%);text-align:center;font-style:italic;font-size:20px;color:#fff6d8;text-shadow:0 1px 10px rgba(90,50,0,.6);opacity:0;transition:opacity .8s;padding:0 16px}
#hint.on{opacity:1;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
#msg{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 6%);display:flex;justify-content:center;padding:0 22px;opacity:0;transform:translateY(24px) scale(.94);transition:opacity 1.3s,transform 1.3s cubic-bezier(.2,.9,.3,1)}
#msg.on{opacity:1;transform:none}
#msg div{background:rgba(255,248,230,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:22px;padding:24px 22px;max-width:340px;text-align:center;line-height:1.75;font-size:18px;box-shadow:0 12px 40px rgba(80,40,0,.28)}
#msg b{display:block;font-size:28px;margin-bottom:6px;color:#b9851c}
#gate{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:radial-gradient(circle at 50% 45%,#ecc968,#c79a34);transition:opacity 1.1s ease .15s}
#gate.open{opacity:0;pointer-events:none}
#gift{font-size:100px;animation:bob 1.5s ease-in-out infinite;transition:transform .9s cubic-bezier(.5,-.4,.5,1.4),opacity .6s .2s}
#gate.open #gift{transform:scale(3.4) rotate(18deg);opacity:0;animation:none}
@keyframes bob{50%{transform:translateY(-14px) rotate(-6deg)}}
#gate p{margin:0;font-size:21px;font-weight:700;color:#4a2e0e;transition:opacity .4s}
#gate small{opacity:.75;transition:opacity .4s}
#gate.open p,#gate.open small{opacity:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
<h1 id="title"></h1>
<div id="msg"><div>
<b>Happy 19th ✨</b>
Happy birthday, Lara.<br>
I hope this year is even better than the last one,<br>and that every wish you just made comes true. 🤍
</div></div>
<div id="hint"></div>
</div>
<div id="gate">
<div id="gift">🎁</div>
<p>A little gift is waiting for you…<br>Tap it</p>
<small>If it asks for the microphone, please allow it 🎤</small>
</div>

function tone(f,d,type,v,slide){if(!ac)return;var t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.03)}
function noise(d,v,f){if(!ac)return;var n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(var i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);var s=ac.createBufferSource();s.buffer=b;var fl=ac.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;var g=ac.createGain();g.gain.value=v;s.connect(fl);fl.connect(g);g.connect(ac.destination);s.start()}

  if(!ac)return;
  var N={G4:392,A4:440,B4:494,C5:523,D5:587,E5:659,F5:698,G5:784};
  var S=[['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
         ['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
         ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',1],
         ['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2]];
  var t=ac.currentTime+.5,beat=.42;
  S.forEach(function(n){
    [1,2].forEach(function(m){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type=m===1?'triangle':'sine';o.frequency.value=N[n[0]]*m;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(m===1?.22:.07,t+.03);
      g.gain.exponentialRampToValueAtTime(.001,t+n[1]*beat*.95);
      o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+n[1]*beat);
    });
    t+=n[1]*beat;
  });
}

function toW(gx,gy){return [cx0+px*7+gx*cakeSc,baseY+cakeY+gy*cakeSc]}
function puff(c,n){var ch=B*.085,p=toW(c.x,c.gy+c.off-ch-3);for(var i=0;i<(n||4);i++)smoke.push({x:p[0]+rnd(-2,2),y:p[1]-i*3,vx:rnd(-6,10),vy:rnd(-34,-20),l:1,s:rnd(3,5),ph:rnd(0,6)})}
function confetti(n){for(var i=0;i<n;i++)conf.push({x:rnd(0,W),y:rnd(-H*.4,-10),vx:rnd(-20,20),vy:rnd(110,230),r:rnd(0,6),vr:rnd(-6,6),w:rnd(6,10),h:rnd(10,15),c:PAL[i%PAL.length],ph:rnd(0,6)})}

/* ---------- drawing ---------- */
function drawBG(){
  var g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#cfa23a');g.addColorStop(.5,'#dcb552');g.addColorStop(1,'#b98c3c');cx.fillStyle=g;cx.fillRect(0,0,W,H);
  if(paint&&pa>.003){
    var P=Math.max(W*2.4,H*1.1)*pz*(1+.015*Math.sin(T*.5));
    cx.globalAlpha=pa;
    cx.drawImage(paint,W/2-P*.5-px*16+Math.sin(T*.23)*6,H*.45-P*.68-py*16+Math.cos(T*.19)*5,P,P);
    cx.globalAlpha=1;
  }
  cx.globalCompositeOperation='lighter';
  for(var i=0;i<dust.length;i++){var d=dust[i];d.y-=d.sp*.016;if(d.y<-.02)d.y=1.02;
    var a=(.2+.5*Math.abs(Math.sin(T*d.ph+i)))*Math.min(1,pa*1.6);
    cx.fillStyle='rgba(255,236,160,'+a.toFixed(3)+')';cx.beginPath();cx.arc(d.x*W-px*d.r*9,d.y*H,d.r,0,7);cx.fill()}
  cx.globalCompositeOperation='source-over';
  if(room>.004){cx.fillStyle='rgba(48,22,4,'+room.toFixed(3)+')';cx.fillRect(0,0,W,H)}
}
function drawTier(g,t,i){
  if(!t.on)return;
  var rx=g.w/2,ry=g.ry,yb=g.yb+t.y,top=yb-g.h;
  cx.save();cx.translate(0,yb);cx.scale(1+t.sq*.45,1-t.sq);cx.translate(0,-yb);
  var gr=cx.createLinearGradient(-rx,0,rx,0);gr.addColorStop(0,t.c[1]);gr.addColorStop(.28,t.c[0]);gr.addColorStop(.62,t.c[0]);gr.addColorStop(1,t.c[1]);
  cx.fillStyle=gr;cx.beginPath();cx.moveTo(-rx,top);cx.lineTo(-rx,yb);cx.ellipse(0,yb,rx,ry,0,Math.PI,0,true);cx.lineTo(rx,top);cx.closePath();cx.fill();
  // gold band + motifs
  cx.strokeStyle='#d6a62c';cx.lineWidth=2;cx.beginPath();cx.ellipse(0,yb-g.h*.36,rx,ry,0,0,Math.PI);cx.stroke();
  if(i===1){cx.strokeStyle='#b3862a';cx.lineWidth=1.4;var n=Math.round(g.w/26);for(var k=0;k<n;k++){var x=-rx+(k+.5)/n*g.w,yy=yb-g.h*.66+ry*Math.sqrt(1-(x/rx)*(x/rx));cx.beginPath();cx.arc(x,yy,4.2,0,7);cx.stroke();cx.beginPath();cx.arc(x,yy,1.6,0,7);cx.stroke()}}
  // pearls
  var pn=Math.round(g.w/15);for(var k=0;k<pn;k++){var x=-rx+(k+.5)/pn*g.w,yy=yb+ry*Math.sqrt(1-(x/rx)*(x/rx))-4;cx.fillStyle='#fff4d2';cx.strokeStyle='#caa13a';cx.lineWidth=1;cx.beginPath();cx.arc(x,yy,3.1,0,7);cx.fill();cx.stroke()}
  // top surface
  var tg=cx.createRadialGradient(0,top,2,0,top,rx);tg.addColorStop(0,'#fffdf4');tg.addColorStop(1,'#f3e4c4');
  cx.fillStyle=tg;cx.beginPath();cx.ellipse(0,top,rx,ry,0,0,7);cx.fill();
  cx.strokeStyle='rgba(255,255,255,.7)';cx.lineWidth=1.2;cx.stroke();
  // drips
  cx.fillStyle='#fff9ec';cx.beginPath();cx.moveTo(-rx,top);var N=44,i2,x2,e,d;
  for(i2=0;i2<=N;i2++){x2=-rx+i2/N*g.w;e=top+ry*Math.sqrt(Math.max(0,1-(x2/rx)*(x2/rx)));d=5+10*Math.pow(Math.max(0,Math.sin(x2*.2+i*2.1)),3)+2.5*Math.sin(x2*.55);cx.lineTo(x2,e+d)}
  cx.lineTo(rx,top);for(i2=N;i2>=0;i2--){x2=-rx+i2/N*g.w;cx.lineTo(x2,top+ry*Math.sqrt(Math.max(0,1-(x2/rx)*(x2/rx))))}
  cx.closePath();cx.fill();
  cx.restore();
}
function drawCandle(c){
  if(c.st===0)return;
  var ch=B*.085,cw=B*.021;
  cx.save();cx.translate(c.x,c.gy+c.off);cx.rotate(c.rot);
  cx.fillStyle=c.col[0];cx.fillRect(-cw/2,-ch,cw,ch);
  cx.fillStyle=c.col[1];
  for(var s=ch*.12;s<ch;s+=cw*1.7){cx.beginPath();cx.moveTo(-cw/2,-s);cx.lineTo(cw/2,-s-cw*.6);cx.lineTo(cw/2,-s-cw*1.25);cx.lineTo(-cw/2,-s-cw*.65);cx.closePath();cx.fill()}
  cx.fillStyle='rgba(255,255,255,.45)';cx.fillRect(-cw*.3,-ch,cw*.18,ch);
  cx.fillStyle='#3a2a1a';cx.fillRect(-.6,-ch-3,1.2,3);
  cx.restore();
}
function flamePath(x,y,w,h,tip){cx.beginPath();cx.moveTo(x,y);cx.bezierCurveTo(x-w,y-h*.25,x-w*.7+tip*.3,y-h*.72,x+tip,y-h);cx.bezierCurveTo(x+w*.7+tip*.3,y-h*.72,x+w,y-h*.25,x,y);cx.fill()}
function drawFlame(c){
  var ch=B*.085,x0=c.x,y0=c.gy+c.off-ch-3;
  if(c.em>.03){var er=cx.createRadialGradient(x0,y0,0,x0,y0,7);er.addColorStop(0,'rgba(255,120,30,'+(c.em*.9).toFixed(2)+')');er.addColorStop(1,'rgba(255,90,0,0)');cx.globalCompositeOperation='lighter';cx.fillStyle=er;cx.fillRect(x0-8,y0-8,16,16);cx.globalCompositeOperation='source-over'}
  if(c.fl<.02)return;
  var h=B*.085*c.fl*(1-wind*.3),w=h*.36,f=Math.sin(T*10+c.ph)*.5+Math.sin(T*17.3+c.ph*2.3)*.3;
  var lean=tilt*.8+wind*(1.1+Math.sin(c.ph)*.3)+f*.16,tip=lean*h*.55;
  var gx=x0+tip*.35,gy=y0-h*.45,gr=h*3.4;
  cx.globalCompositeOperation='lighter';
  var g1=cx.createRadialGradient(gx,gy,0,gx,gy,gr);g1.addColorStop(0,'rgba(255,175,70,'+(.4*Math.min(1,c.fl)).toFixed(2)+')');g1.addColorStop(1,'rgba(255,140,40,0)');
  cx.fillStyle=g1;cx.fillRect(gx-gr,gy-gr,gr*2,gr*2);
  cx.globalCompositeOperation='source-over';
  cx.fillStyle='rgba(255,150,30,.96)';flamePath(x0,y0,w,h,tip);
  cx.fillStyle='#fff1a8';flamePath(x0,y0-h*.04,w*.55,h*.62,tip*.55);
  cx.fillStyle='rgba(120,160,255,.6)';cx.beginPath();cx.ellipse(x0,y0-h*.07,w*.28,h*.1,0,0,7);cx.fill();
}
function drawCake(){
  var g=geom();
  cx.save();cx.translate(cx0+px*7,baseY+cakeY);cx.scale(cakeSc,cakeSc);
  var plA=Math.min(1,Math.max(0,(T-.9)/.6));
  if(plA>0){
    cx.globalAlpha=plA;
    cx.fillStyle='rgba(60,30,0,.22)';cx.beginPath();cx.ellipse(0,B*.035,B*.68,B*.09,0,0,7);cx.fill();
    var pg=cx.createLinearGradient(0,-B*.07,0,B*.08);pg.addColorStop(0,'#fff6dc');pg.addColorStop(1,'#cfae6c');
    cx.fillStyle=pg;cx.beginPath();cx.ellipse(0,0,B*.62,B*.075,0,0,7);cx.fill();
    cx.strokeStyle='rgba(180,130,40,.5)';cx.lineWidth=1.5;cx.beginPath();cx.ellipse(0,-1,B*.55,B*.06,0,0,7);cx.stroke();
    cx.globalAlpha=1;
  }
  for(var i=0;i<3;i++)drawTier(g[i],TIERS[i],i);
  if(ls>.01){
    cx.save();var ly=g[0].yb+TIERS[0].y-g[0].h*.5+g[0].ry*.55;cx.translate(0,ly);cx.scale(ls,ls);
    cx.font='700 '+Math.round(B*.17)+'px Georgia,serif';cx.textAlign='center';cx.textBaseline='middle';
    var lg=cx.createLinearGradient(0,-B*.09,0,B*.09);lg.addColorStop(0,'#fff3b0');lg.addColorStop(.5,'#e3b23a');lg.addColorStop(1,'#a8741a');
    cx.shadowColor='rgba(255,230,150,.9)';cx.shadowBlur=12;cx.fillStyle=lg;cx.fillText('L',0,0);cx.shadowBlur=0;
    cx.strokeStyle='#7a5210';cx.lineWidth=.8;cx.strokeText('L',0,0);cx.restore();
  }
  var order=cand.slice().sort(function(a,b){return a.gy-b.gy});
  order.forEach(drawCandle);
  if(litN>0){var cg=g[2],ly2=cg.top-B*.06,wg=cx.createRadialGradient(0,ly2,0,0,ly2,B*.8);cx.globalCompositeOperation='lighter';wg.addColorStop(0,'rgba(255,170,70,'+(.2*litN/19).toFixed(3)+')');wg.addColorStop(1,'rgba(255,140,40,0)');cx.fillStyle=wg;cx.fillRect(-B,ly2-B,B*2,B*2);cx.globalCompositeOperation='source-over'}
  order.forEach(drawFlame);
  cx.restore();
}
function drawFX(dt){
  // smoke
  for(var i=smoke.length-1;i>=0;i--){var s=smoke[i];s.y+=s.vy*dt;s.x+=s.vx*dt+Math.sin(T*2.5+s.ph)*14*dt;s.s+=dt*16;s.l-=dt*.45;
    if(s.l<=0){smoke.splice(i,1);continue}
    cx.globalAlpha=s.l*.3;cx.fillStyle='#efe7da';cx.beginPath();cx.arc(s.x,s.y,s.s,0,7);cx.fill()}
  cx.globalAlpha=1;
  // sparks
  cx.globalCompositeOperation='lighter';cx.lineCap='round';
  for(var i=sparks.length-1;i>=0;i--){var p=sparks[i];p.px=p.x;p.py=p.y;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=.992;p.l-=p.d*dt;
    if(p.l<=0){sparks.splice(i,1);continue}
    cx.globalAlpha=Math.min(1,p.l*1.4)*(p.l<.3?.5+.5*Math.random():1);cx.strokeStyle=p.c;cx.lineWidth=p.s*Math.max(.4,p.l);
    cx.beginPath();cx.moveTo(p.px,p.py);cx.lineTo(p.x,p.y);cx.stroke()}
  cx.globalAlpha=1;cx.globalCompositeOperation='source-over';
  // confetti
  for(var i=conf.length-1;i>=0;i--){var c=conf[i];c.x+=(c.vx+Math.sin(T*3+c.ph)*30)*dt;c.y+=c.vy*dt;c.r+=c.vr*dt;
    if(c.y>H+30){conf.splice(i,1);continue}
    cx.save();cx.translate(c.x,c.y);cx.rotate(c.r);cx.scale(1,Math.cos(T*6+c.ph));cx.fillStyle=c.c;cx.fillRect(-c.w/2,-c.h/2,c.w,c.h);cx.restore()}
  // paper grain
  if(grain){cx.globalAlpha=.55;cx.fillStyle=grain;cx.fillRect(0,0,W,H);cx.globalAlpha=1}
}

/* ---------- logic ---------- */
function update(dt){
  T=started?(performance.now()-startT)/1000:0;
  if(started){
    if(T>=0&&paT===0){paT=.62;pzT=1}
    if(T>=.8&&!document.body.classList.contains('title'))document.body.classList.add('title');
    if(T>=ROOM_AT&&!done&&roomT===0)roomT=.3;
    if(T>=READY_AT&&!ready){ready=true;hint.textContent=micOn?'Make a wish… then blow! 💨':'Make a wish… then tap the cake 🕯️';hint.classList.add('on')}
  }
  pa=damp(pa,paT,.9,dt);pz=damp(pz,pzT,.7,dt);room=damp(room,roomT,1.1,dt);
  tilt=damp(tilt,tx/40,6,dt);px=damp(px,tx/40,3,dt);py=damp(py,ty/40,3,dt);
  cakeSc=damp(cakeSc,cakeScT,2.2,dt);cakeY=damp(cakeY,cakeYT,2.2,dt);
  if(blown&&!done)wind=damp(wind,1,14,dt);else wind=damp(wind,0,2.2,dt);
  var g=geom();
  // tiers
  TIERS.forEach(function(t,i){
    if(!t.on&&started&&T>=t.at){t.on=true;t.y=-(baseY+B*.9)/cakeSc;t.vy=0}
    if(!t.on||t.set)return;
    t.vy+=2600*dt;t.y+=t.vy*dt;
    if(t.y>=0){var imp=t.vy;t.y=0;thump();
      if(imp>420){t.vy=-imp*.28;t.sq=Math.min(.15,imp/12000);t.sqv=0}else{t.vy=0;t.set=true}
      for(var k=0;k<i;k++)TIERS[k].sqv+=.5;
      var p=toW(0,g[i].yb);burst(p[0],p[1],14,170,1.8);}
  });
  TIERS.forEach(function(t){t.sqv+=(-t.sq*260-t.sqv*12)*dt;t.sq+=t.sqv*dt});
  if(started&&T>=L_AT){lsv+=((1-ls)*130-lsv*9)*dt;ls+=lsv*dt}
  // candles
  litN=0;
  var r=g[2];
  cand.forEach(function(c){
    c.gx=Math.cos(c.a)*r.w/2*.72;c.gy=r.top+Math.sin(c.a)*r.ry*.72;
    if(c.st===0&&started&&T>=c.at&&TIERS[2].set){c.st=1;c.o0=-(baseY+260)/cakeSc;c.off=c.o0;c.vy=0;c.vr=rnd(-7,7)}
    if(c.st===1){
      c.vy+=2600*dt;c.off+=c.vy*dt;c.rot+=c.vr*dt;
      if(c.off>=0){c.off=0;tick(c.idx);if(c.vy>260){c.vy=-c.vy*.27;c.vr*=.35;var p=toW(c.x,c.gy);burst(p[0],p[1],2,60,1.4)}else{c.vy=0;c.st=2;c.lt=T+.22}}
    }
    c.x=c.gx+(c.st===1&&c.o0<0?c.dx*Math.max(0,c.off/c.o0):0);
    if(c.st===2){c.rot=damp(c.rot,0,14,dt);if(!c.lit&&!c.out&&T>=c.lt){c.lit=true}}
    if(c.lit){c.fl=damp(c.fl,1,9,dt);litN++}
    if(blown&&!c.out&&c.lit&&T>=c.outAt){c.out=true;c.lit=false;c.em=1;puff(c,4)}
    if(c.out){c.fl=damp(c.fl,0,16,dt);c.em=damp(c.em,0,1.4,dt);if(c.em>.35&&Math.random()<dt*9)puff(c,1)}
  });
  if(blown&&!celeb&&T>=blownAt+.8)celebrate();
}
function blowOut(){
  if(!ready||blown||done)return;
  blown=true;blownAt=T;hint.classList.remove('on');
  cand.forEach(function(c){c.outAt=T+rnd(.05,.4)});
  noise(.55,.32,900);
}
function celebrate(){
  celeb=true;done=true;roomT=0;paT=1;pzT=.96;cakeScT=.8;cakeYT=H*.2;
  document.getElementById('title').classList.add('gone');
  for(var k=0;k<7;k++)(function(k){setTimeout(function(){burst(rnd(W*.1,W*.9),rnd(H*.12,H*.5),70,rnd(200,300),2.4);noise(.3,.12,500);tone(180,.25,'sine',.14,60)},k*380)})(k);
  confetti(70);var cf=setInterval(function(){confetti(5)},260);setTimeout(function(){clearInterval(cf)},6500);
  setTimeout(function(){document.getElementById('msg').classList.add('on')},1100);
  setTimeout(function(){hint.textContent='Touch the screen ✨';hint.classList.add('on')},3500);
  melody();
}

/* ---------- permissions + gate (must start from a tap on iPhone) ---------- */
function startMic(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!ac)return;
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(s){
    micOn=true;if(ready&&!blown)hint.textContent='Make a wish… then blow! 💨';
    var an=ac.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.3;ac.createMediaStreamSource(s).connect(an);
    var td=new Uint8Array(an.fftSize),fd=new Uint8Array(an.frequencyBinCount),lowBins=Math.max(2,Math.floor(500/(ac.sampleRate/an.fftSize)));
    (function loop(){
      an.getByteTimeDomainData(td);an.getByteFrequencyData(fd);
      var sum=0,i;for(i=0;i<td.length;i++){var v=(td[i]-128)/128;sum+=v*v}
      var rms=Math.sqrt(sum/td.length),low=0;for(i=0;i<lowBins;i++)low+=fd[i];low=low/lowBins/255;   // breath energy sits in low frequencies
      if(ready&&!blown&&Math.max(rms,low*.55)>BLOW)blowOut();
      if(!done)requestAnimationFrame(loop);
    })();
  }).catch(function(){micOn=false;if(ready&&!blown)hint.textContent='Make a wish… then tap the cake 🕯️'});
}
function listenTilt(){window.addEventListener('deviceorientation',function(e){tx=Math.max(-40,Math.min(40,e.gamma||0));ty=Math.max(-40,Math.min(40,(e.beta||45)-45))})}
function begin(){
  if(started)return;started=true;startT=performance.now();
  var AC=window.AudioContext||window.webkitAudioContext;try{ac=new AC();ac.resume()}catch(e){}
  try{if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){DeviceOrientationEvent.requestPermission().then(function(r){if(r==='granted')listenTilt()}).catch(function(){})}else listenTilt()}catch(e){}
  startMic();
  gate.classList.add('open');setTimeout(function(){gate.style.display='none'},1500);
  burst(W/2,H*.5,90,320,2.6);tone(520,.5,'triangle',.12,1560);
}
gate.addEventListener('touchend',function(e){e.preventDefault();begin()},{passive:false});
gate.addEventListener('click',begin);

/* ---------- touch ---------- */
cv.addEventListener('pointerdown',function(e){
  if(!started)return;
  burst(e.clientX,e.clientY,done?45:8,done?260:90,done?2.2:1.6);
  if(done){tone(300+Math.random()*300,.25,'sine',.1,80)}
  else if(ready&&!blown){var cy=baseY+cakeY-B*.45;if(!micOn||Math.abs(e.clientY-cy)<B*.6)blowOut()}
});
cv.addEventListener('pointermove',function(e){
  if(e.pointerType==='mouse'){tx=(e.clientX/W-.5)*60;ty=(e.clientY/H-.5)*60}
  if(started&&(e.pointerType==='touch'||e.buttons))spark(e.clientX+rnd(-6,6),e.clientY+rnd(-6,6),rnd(-20,20),rnd(-30,10),1,rnd(1.2,2),2,PAL[(Math.random()*PAL.length)|0],60);
});

/* ---------- loop ---------- */
function rs(){W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cx.setTransform(DPR,0,0,DPR,0,0);B=Math.min(W*.8,340,H*.44);cx0=W/2;baseY=H*.64}
rs();addEventListener('resize',rs);
var last=performance.now();
(function frame(now){
  var dt=Math.min(.033,(now-last)/1000||.016);last=now;
  update(dt);drawBG();drawCake();drawFX(dt);
  requestAnimationFrame(frame);
})(last);
})();
</script>
